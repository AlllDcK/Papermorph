<script>
'use strict';
const CHAPTER = { number: 1, title: 'Уравнение теплопроводности: смешанная задача и метод Фурье', minutes: 15, language: 'ru' };

/* ---------- chapter drawing helpers (prefix mp: methods of mathematical physics) ---------- */
const PI = Math.PI;
const C_PHI = COL.int, C_BC = COL.whole, C_SRC = COL.rat;   // initial data, boundary data, sources (BOOK.md)
const MODE = [COL.irr, COL.real, COL.nat, COL.task];        // Fourier modes k = 1, 2, 3, 4
const fmt = (v, d = 2) => v.toFixed(d).replace('.', ',');   // decimal comma
const cm = (fill, ...parts) => ({ m: parts, fill });         // coloured inline math for mpRow
const mline = (p, parts, x, y, t0, fill = COL.chalk, size = 44, anchor = 'start') => { const e = M(p, [].concat(parts), { x, y, size, fill, anchor, o: 0 }); show(e, t0); return e; };
const text = (p, str, x, y, t0, { size = 28, fill = COL.chalk, anchor = 'start', weight = 500 } = {}) => { const e = T(p, str, { x, y, size, fill, anchor, weight, o: 0 }); show(e, t0); return e; };

// Words and math side by side on one baseline: items are strings or $m(...) / cm(colour, ...).
function mpRow(p, items, x, y, t0, { size = 28, msize = Math.round(size * 1.3), fill = COL.chalk, weight = 500, anchor = 'start' } = {}) {
  const g = G(p, { o: 0 });
  let cx = 0;
  for (const it of [].concat(items)) {
    if (typeof it === 'string') {
      T(g, it, { x: cx, size, fill, weight });
      ctx2d.font = `${weight} ${size}px ${UI}`;
      cx += ctx2d.measureText(it).width;
    } else cx += M(g, it.m, { x: cx, size: msize, fill: it.fill || fill, anchor: 'start' })._w;
  }
  put(g, { x: anchor === 'middle' ? x - cx / 2 : anchor === 'end' ? x - cx : x, y });
  g._w = cx;
  show(g, t0);
  return g;
}
// A formula in an amber frame.
function mpBox(p, parts, x, y, t0, { size = 44, color = COL.task, fill = COL.chalk, anchor = 'start' } = {}) {
  const g = G(p, { o: 0 }), m = M(g, parts, { x, y, size, fill, anchor });
  const tall = parts.some(q => q && q.f), x1 = anchor === 'middle' ? x - m._w / 2 : anchor === 'end' ? x - m._w : x;
  mk('rect', { x: x1 - 18, y: y - size * (tall ? 1.15 : 1), width: m._w + 36, height: size * (tall ? 1.75 : 1.4), rx: 12, fill: 'none', stroke: color, 'stroke-width': 3 }, g);
  show(g, t0);
  return g;
}
// Frame around one token of a tokens() row.
function mpFrame(p, tok, row, color, t0) {
  const e = mk('rect', { x: tok._px - tok._w / 2 - 8, y: row.y - row.size * 1.05, width: tok._w + 16, height: row.size * 1.6, rx: 10, fill: 'none', stroke: color, 'stroke-width': 3 }, p);
  put(e, { o: 0 });
  show(e, t0, .3);
  return e;
}
// Curly brace under x1..x2 at height y.
function mpBrace(p, x1, x2, y, color, t0) {
  const c = (x1 + x2) / 2, e = path(p, `M${x1} ${y}q0 12 12 12H${c - 12}q12 0 12 12q0 -12 12 -12H${x2 - 12}q12 0 12 -12`, { stroke: color, 'stroke-width': 3 }, { d: 0 });
  draw(e, t0, .6);
  return e;
}
function mpArrow(p, x1, y1, x2, y2, color = COL.task, w = 4) {
  const a = Math.atan2(y2 - y1, x2 - x1), hx = s => x2 - 15 * Math.cos(a + s * .5), hy = s => y2 - 15 * Math.sin(a + s * .5);
  const g = G(p, { o: 0 });
  path(g, `M${x1} ${y1}L${x2} ${y2}`, { stroke: color, 'stroke-width': w });
  path(g, `M${hx(1)} ${hy(1)}L${x2} ${y2}L${hx(-1)} ${hy(-1)}`, { stroke: color, 'stroke-width': w });
  return g;
}
// A vertical arrow from y1 whose tip can move: g.set(y2).
function mpVArrow(p, x, y1, y2, color = COL.task) {
  const g = G(p, { o: 0 }), shaft = path(g, '', { stroke: color, 'stroke-width': 4 }), head = path(g, '', { stroke: color, 'stroke-width': 4 });
  g.set = yy => {
    const s = yy < y1 ? 1 : -1;
    shaft.setAttribute('d', `M${x} ${y1}V${yy}`);
    head.setAttribute('d', Math.abs(yy - y1) < 16 ? '' : `M${x - 9} ${yy + 14 * s}L${x} ${yy}L${x + 9} ${yy + 14 * s}`);
  };
  g.set(y2);
  return g;
}
const dotAt = (p, x, y, color, r = 9) => { const g = G(p, { x, y, s: 0, o: 0 }); mk('circle', { r, fill: color, stroke: COL.board, 'stroke-width': 2.5 }, g); return g; };

// Heat colours for the rod: zero is dark, warm values glow amber to pale yellow, negative values glow blue.
const H_COLD = '#78b4dc', H_ZERO = '#2a434d', H_WARM = '#d97f3a', H_HOT = '#f8dc96';
function heat(v) {
  if (v < 0) return mix(H_ZERO, H_COLD, Math.min(1, -v));
  return v < .55 ? mix(H_ZERO, H_WARM, v / .55) : mix(H_WARM, H_HOT, Math.min(1, (v - .55) / .45));
}
// Graph of a profile u(x) on [0, L]: (x0, y0) is the point (0, 0), w px for the whole segment, k px per unit of u.
function mpGraph(p, { x0, y0, w, L = PI, k = 150, lo = -1, hi = 1, t0 = .1, end = 'π', yl = 'u' }) {
  const g = G(p, { o: 0 }), ax = { stroke: COL.dim, 'stroke-width': 2.5 };
  const X = x => x0 + w * x / L, Y = u => y0 - k * u;
  path(g, `M${x0 - 14} ${y0}H${x0 + w + 46}`, ax);
  path(g, `M${x0 + w + 34} ${y0 - 8}L${x0 + w + 46} ${y0}L${x0 + w + 34} ${y0 + 8}`, ax);
  path(g, `M${x0} ${Y(lo) + 8}V${Y(hi) - 34}`, ax);
  path(g, `M${x0 - 8} ${Y(hi) - 22}L${x0} ${Y(hi) - 34}L${x0 + 8} ${Y(hi) - 22}`, ax);
  path(g, `M${x0 + w} ${y0 - 9}V${y0 + 9}`, ax);
  M(g, ['x'], { x: x0 + w + 52, y: y0 + 34, size: 30, fill: COL.dim });
  M(g, [yl], { x: x0 - 24, y: Y(hi) - 26, size: 30, fill: COL.dim });
  M(g, ['0'], { x: x0 - 18, y: y0 + 34, size: 28, fill: COL.dim });
  M(g, [end], { x: x0 + w, y: y0 + 36, size: 28, fill: COL.dim });
  show(g, t0);
  const d = (f, n = 120) => {
    let s = '';
    for (let i = 0; i <= n; i++) { const x = L * i / n; s += (i ? 'L' : 'M') + X(x).toFixed(1) + ' ' + Y(f(x)).toFixed(1); }
    return s;
  };
  return { g, X, Y, L, x0, y0, w, k, d };
}
const mpCurve = (gr, f, color = COL.chalk, width = 4.5, o = 0) => path(gr.g, gr.d(f), { stroke: color, 'stroke-width': width }, { o });
const mpSet = (gr, e, f) => e.setAttribute('d', gr.d(f));
// The rod, split into thin cells coloured by temperature: rod.set(u) with u(x) on [0, L].
function mpRod(p, { x0, y, w, h = 46, L = PI, n = 64, scale = 1, t0 = .1, hatch = false }) {
  const g = G(p, { o: 0 });
  const cells = Array.from({ length: n }, (_, i) => mk('rect', { x: x0 + w * i / n, y, width: w / n + .8, height: h, fill: heat(0) }, g));
  mk('rect', { x: x0, y, width: w, height: h, rx: 3, fill: 'none', stroke: COL.dim, 'stroke-width': 2 }, g);
  if (hatch) for (let i = 0; i <= w - 12; i += 26) {
    path(g, `M${x0 + i} ${y - 6}l12 -12`, { stroke: COL.faint, 'stroke-width': 2 });
    path(g, `M${x0 + i} ${y + h + 18}l12 -12`, { stroke: COL.faint, 'stroke-width': 2 });
  }
  g.set = f => cells.forEach((c, i) => c.setAttribute('fill', heat(f(L * (i + .5) / n) / scale)));
  show(g, t0);
  return g;
}
// Blue clamps on the rod ends: the boundary values are held there.
function mpClamps(p, x0, w, y, h, t0) {
  const g = G(p, { o: 0 });
  for (const x of [x0 - 16, x0 + w]) mk('rect', { x, y: y - 18, width: 16, height: h + 36, rx: 5, fill: C_BC }, g);
  show(g, t0);
  return g;
}
// "t = 0,00" that follows the model time: clock.set(τ).
function mpClock(p, x, y, t0, { size = 34, anchor = 'end' } = {}) {
  const t = T(p, '', { x, y, size, font: MATH, fill: COL.dim, anchor, o: 0 });
  mk('tspan', { 'font-style': 'italic' }, t).textContent = 't';
  const v = mk('tspan', {}, t);
  v.textContent = ' = 0,00';
  t.set = τ => { v.textContent = ' = ' + fmt(τ); };
  show(t, t0);
  return t;
}
// Mode spectrum: one bar per mode in its colour; bars.set([T1, T2, …]).
function mpBars(p, { x0, y0, k = 100, n = 4, gap = 78, bw = 38, t0 = .1 }) {
  const g = G(p, { o: 0 });
  path(g, `M${x0 - 34} ${y0}H${x0 + (n - 1) * gap + 34}`, { stroke: COL.dim, 'stroke-width': 2 });
  const bars = MODE.slice(0, n).map((c, i) => {
    M(g, ['k = ' + (i + 1)], { x: x0 + i * gap, y: y0 + 32, size: 22, fill: c });
    return mk('rect', { x: x0 + i * gap - bw / 2, y: y0, width: bw, height: 0, rx: 3, fill: c }, g);
  });
  g.set = vals => vals.forEach((v, i) => {
    if (!bars[i]) return;
    const hh = Math.abs(v) * k;
    bars[i].setAttribute('y', v >= 0 ? y0 - hh : y0);
    bars[i].setAttribute('height', hh);
  });
  show(g, t0);
  return g;
}
// Run model time τ from T0 to T1 between t0 and t0 + dur.
const mpRun = (upd, t0, dur, T0, T1, ease = lin) => prog(q => upd(T0 + (T1 - T0) * q), t0, dur, ease);

// The domain Q = {0 < x < l, t > 0}: bottom edge yellow (initial condition), sides blue (boundary conditions).
const DOM = { x0: 190, y0: 790, w: 500, top: 150 };
(() => {   // shading of the half-strip, fading upwards (t → ∞)
  const lg = mk('linearGradient', { id: 'mpFade', x1: 0, y1: 1, x2: 0, y2: 0 }, document.querySelector('#stage defs'));
  mk('stop', { offset: 0, 'stop-color': COL.chalk, 'stop-opacity': .13 }, lg);
  mk('stop', { offset: .7, 'stop-color': COL.chalk, 'stop-opacity': .06 }, lg);
  mk('stop', { offset: 1, 'stop-color': COL.chalk, 'stop-opacity': 0 }, lg);
})();
function mpDomain(p, t0) {
  const { x0, y0, w, top } = DOM, g = G(p, { o: 0 }), ax = { stroke: COL.dim, 'stroke-width': 2.5 };
  mk('rect', { x: x0, y: top, width: w, height: y0 - top, fill: 'url(#mpFade)' }, g);
  path(g, `M${x0 - 30} ${y0}H${x0 + w + 90}`, ax);
  path(g, `M${x0 + w + 78} ${y0 - 8}L${x0 + w + 90} ${y0}L${x0 + w + 78} ${y0 + 8}`, ax);
  path(g, `M${x0} ${y0 + 30}V${top - 50}`, ax);
  path(g, `M${x0 - 8} ${top - 38}L${x0} ${top - 50}L${x0 + 8} ${top - 38}`, ax);
  M(g, ['x'], { x: x0 + w + 94, y: y0 + 38, size: 32, fill: COL.dim });
  M(g, ['t'], { x: x0 - 30, y: top - 36, size: 32, fill: COL.dim });
  M(g, ['0'], { x: x0 - 22, y: y0 + 38, size: 30, fill: COL.dim });
  M(g, ['l'], { x: x0 + w, y: y0 + 40, size: 30, fill: COL.dim });
  const q = M(g, ['Q'], { x: x0 + w / 2, y: (y0 + top) / 2 + 40, size: 84, fill: COL.dim });
  const edge = (d, c) => path(g, d, { stroke: c, 'stroke-width': 8 }, { d: 0 });
  const bottom = edge(`M${x0} ${y0}H${x0 + w}`, C_PHI);
  const left = edge(`M${x0} ${y0}V${top + 70}`, C_BC), right = edge(`M${x0 + w} ${y0}V${top + 70}`, C_BC);
  const dots = G(g, { o: 0 });   // the sides go on for ever
  for (const x of [x0, x0 + w]) path(dots, `M${x} ${top + 54}V${top}`, { stroke: C_BC, 'stroke-width': 5, 'stroke-dasharray': '2 13' });
  show(g, t0);
  return { g, q, bottom, left, right, dots };
}
// Click targets on the domain (q1): left side, bottom, right side, inside.
function domPicks() {
  const { x0, y0, w, top } = DOM, d = S.dom;
  return [
    { el: d.left, box: [x0 - 30, top + 40, 60, y0 - top - 72], label: 'левая сторона' },
    { el: d.bottom, box: [x0 + 34, y0 - 30, w - 68, 60], label: 'нижнее основание' },
    { el: d.right, box: [x0 + w - 30, top + 40, 60, y0 - top - 72], label: 'правая сторона' },
    { el: d.q, box: [x0 + 56, top + 60, w - 112, y0 - top - 130], label: 'внутренность Q' },
  ];
}
// Three mode graphs sin(kπx/L), k = 1, 2, 3, side by side.
function mpTrio(p, t0, { L = 1, end = 'l', titles }) {
  return [0, 1, 2].map(i => {
    const gr = mpGraph(p, { x0: 110 + i * 500, y0: 330, w: 360, L, k: 105, lo: -1.1, hi: 1.1, end, t0: t0 + i * .25 });
    mline(p, titles[i], 110 + i * 500 + 180, 160, t0 + i * .25, MODE[i], 34, 'middle');
    const c = mpCurve(gr, x => Math.sin((i + 1) * PI * x / L), MODE[i]);
    show(c, t0 + .3 + i * .25);
    return { gr, c, i };
  });
}
// supBlanks: blanks whose {box, sup: true} boxes sit raised in an exponent.
const supBlanks = rows => (body, api) => {
  const ctl = blanks(rows)(body, api), boxes = body.querySelectorAll('input.box');
  let i = 0;
  rows.forEach(r => r.parts.forEach(q => { if (q && q.box !== undefined) { if (q.sup) boxes[i].classList.add('sup'); i++; } }));
  return ctl;
};
const LEFTCARD = { x: 50, y: 110, w: 790, cls: 'side', maxH: 600 };
const RIGHTCARD = { x: 780, y: 120, w: 780, cls: 'side', maxH: 700 };
const SUMS = [1, 2, 5, 15];   // numbers of odd terms in the partial sums of the sine series of 1 (ex. 1.2)
const sum1 = (x, N) => { let s = 0; for (let n = 1; n <= N; n++) s += 4 / (PI * (2 * n - 1)) * Math.sin((2 * n - 1) * x); return s; };
const heat12 = (x, τ) => { let s = 0; for (let n = 1; n <= 40; n++) { const m = 2 * n - 1; s += 4 / (PI * m ** 3) * (1 - Math.exp(-m * m * τ)) * Math.sin(m * x); } return s; };

/* ---------- beats: [id, title, run(m, D), { ask }?] ---------- */
const BEATS = [
  ['intro', 'Глава 1', (m, D) => {
    const g = G(scene, { o: 0, y: 24 });
    T(g, 'Часть 1 · Отрезок: диффузия и колебания · Глава 1', { x: 800, y: 290, size: 28, fill: COL.dim, anchor: 'middle' });
    T(g, 'Уравнение теплопроводности', { x: 800, y: 400, size: 84, weight: 600, anchor: 'middle' });
    T(g, 'смешанная задача и метод Фурье', { x: 800, y: 470, size: 42, fill: COL.task, anchor: 'middle' });
    tw(g, { o: 1, y: 0 }, .2, 1.1, out);
    const rod = mpRod(scene, { x0: 560, y: 548, w: 480, h: 32, t0: .9 });
    rod.set(x => Math.sin(x));
    prog(q => rod.set(x => Math.exp(-2.4 * q) * Math.sin(x)), 1.6, Math.max(2, D - 2.8), io);
    const r = text(scene, 'Как остывает стержень и почему для этого хватает синусов', 800, 680, m('sub'), { size: 32, fill: COL.dim, anchor: 'middle' });
    tw(g, { o: 0, y: -24 }, D - .9, .8); hide(r, D - .9, .8); hide(rod, D - .9, .8);
  }],

  ['rod', 'Стержень', (m) => {
    const p = panel(0), X0 = 330, W = 940, RY = 170, RH = 50;
    const phi = s => .25 + .2 * s + .6 * Math.sin(PI * s);
    const rod = mpRod(p, { x0: X0, y: RY, w: W, h: RH, L: 1, t0: .3 });
    mpRow(p, ['стержень длины ', $m('l')], X0, 132, .5, { size: 28, fill: COL.dim });
    const hatch = G(p, { o: 0 });
    for (let i = 0; i <= W - 12; i += 26) {
      path(hatch, `M${X0 + i} ${RY - 6}l12 -12`, { stroke: COL.dim, 'stroke-width': 2 });
      path(hatch, `M${X0 + i} ${RY + RH + 18}l12 -12`, { stroke: COL.dim, 'stroke-width': 2 });
    }
    show(hatch, m('side'));
    text(p, 'боковая поверхность теплоизолирована', X0, 280, m('side', .4), { size: 26, fill: COL.dim });
    const gr = mpGraph(p, { x0: X0, y0: 720, w: W, L: 1, k: 330, lo: 0, hi: 1.1, end: 'l', t0: m('phi') });
    draw(mpCurve(gr, phi, C_PHI, 5, 1), m('phi', .3), 1.2);
    prog(q => rod.set(s => q * phi(s)), m('phi', .3), 1.2);
    mpRow(p, [cm(C_PHI, 'φ(x)'), ' — температура при ', $m('t = 0')], X0 + 40, 350, m('phi', .8), { size: 26 });
    mpClamps(p, X0, W, RY, RH, m('ends'));
    mline(p, ['α', Sub('0'), '(t)'], X0 - 30, RY + 36, m('ends', .2), C_BC, 36, 'end');
    mline(p, ['α', Sub('l'), '(t)'], X0 + W + 30, RY + 36, m('ends', .6), C_BC, 36);
    for (const [s, t] of [[0, .3], [1, .7]]) pop(dotAt(p, gr.X(s), gr.Y(phi(s)), C_BC, 10), m('ends', t));
    [.3, .55, .8].forEach((s, i) => {   // heat sources: small pink sparks on the rod
      const g = G(p, { x: X0 + W * s, y: RY + RH / 2, s: 0, o: 0 });
      mk('circle', { r: 7, fill: C_SRC }, g);
      for (let a = 0; a < 8; a++) path(g, `M${11 * Math.cos(a * PI / 4)} ${11 * Math.sin(a * PI / 4)}L${17 * Math.cos(a * PI / 4)} ${17 * Math.sin(a * PI / 4)}`, { stroke: C_SRC, 'stroke-width': 2.5 });
      pop(g, m('src', .1 + i * .2));
    });
    mpRow(p, [cm(C_SRC, 'f(x, t)'), ' — источники тепла'], X0 + W, 132, m('src', .5), { size: 26, anchor: 'end' });
    const xs = gr.X(.7);
    const cut = path(p, `M${xs} ${RY - 22}V${720}`, { stroke: COL.task, 'stroke-width': 3, 'stroke-dasharray': '8 8' }, { o: 0 });
    show(cut, m('u'));
    pop(dotAt(p, xs, gr.Y(phi(.7)), COL.task, 9), m('u', .3));
    mpRow(p, [$m('u(x, t)'), ' — температура в сечении ', $m('x'), ' в момент ', $m('t')], 800, 800, m('u', .4), { size: 30, anchor: 'middle' });
    mpRow(p, ['Та же задача — диффузия вещества в трубке: ', $m('u'), ' — концентрация, ', $m('a²'), ' — коэффициент диффузии'], 800, 858, m('diff'), { size: 24, fill: COL.dim, anchor: 'middle' });
  }],

  ['equation', 'Уравнение', (m) => {
    const p = panel(0);
    const row = tokens(p, [[F('∂u', '∂t')], '  −  ', 'a²', [F('∂²u', '∂x²')], '  =  ', { t: 'f(x, t)', fill: C_SRC }], { x: 800, y: 170, size: 62, anchor: 'middle', o: 0 });
    row.forEach((e, i) => show(e, .3 + i * .05));
    // Left terms are labelled to the left, right terms to the right; a short leader drops from each term to its label.
    const lab = (i, items, y, color, side, t0) => {
      const e = row[i], l = e._px - e._w / 2, r = e._px + e._w / 2;
      draw(path(p, `M${l + 4} 212H${r - 4}M${e._px} 212V${y - 26}`, { stroke: color, 'stroke-width': 2.5 }, { d: 0 }), t0, .4);
      return mpRow(p, items, side < 0 ? e._px + 14 : e._px - 14, y, t0 + .2, { size: 25, fill: color, anchor: side < 0 ? 'end' : 'start' });
    };
    lab(0, ['скорость изменения'], 262, COL.task, -1, m('ut'));
    lab(2, [cm(COL.task, 'a² > 0'), ':  температуропроводность'], 316, COL.task, -1, m('a2'));
    lab(3, ['изгиб профиля'], 262, COL.task, 1, m('uxx'));
    lab(5, ['источники тепла'], 316, C_SRC, 1, m('f'));
    mpRow(p, ['кратко:  ', $m('u', Sub('t'), ' − a²u', Sub('xx'), ' = f')], 1560, 120, m('short'), { size: 26, fill: COL.dim, anchor: 'end' });
    // A hump and a dip: u = 0.5 + 0.3 e^{−4τ} sin 2x solves u_t = u_xx with both ends at 0.5.
    const u = τ => x => .5 + .3 * Math.exp(-4 * τ) * Math.sin(2 * x);

      [['Уравнение распадается на задачи Коши для мод.'], [$m('T′', Sub('k'), ' + a²λ', Sub('k'), 'T', Sub('k'), ' = f', Sub('k'), ',  T', Sub('k'), '(0) = φ', Sub('k')), ';   мода гаснет как ', $m('e', E(['−a²λ', Sub('k'), 't']))], 'w3'],
      [['Неоднородные концы: замена ', $m('u = v + w'), '.'], [$m('w'), ' — прямая между ', $m('α', Sub('0'), '(t)'), ' и ', $m('α', Sub('l'), '(t)'), ';  у ', $m('v'), ' концы нулевые'], 'w4'],
    ];
    items.forEach(([head, detail, mark], i) => {
      const g = G(p, { x: -16, y: 190 + i * 168, o: 0 });
      mk('circle', { cx: 150, cy: -12, r: 26, fill: COL.task }, g);
      T(g, String(i + 1), { x: 150, y: -1, size: 30, fill: COL.board, weight: 700, anchor: 'middle' });
      mpRow(g, head, 210, 0, m(mark), { size: 34, weight: 600 });
      mpRow(g, detail, 210, 62, m(mark), { size: 26, fill: COL.dim });
      tw(g, { o: 1, x: 0 }, m(mark), .6);
    });
  }],

  ['final1', 'Практика 1', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-two-modes', prompt: ['Задача 1. ', $m('u', Sub('t'), ' = u', Sub('xx')), ' на ', $m('(0, π)'), ', ', $m('u(x, 0) = sin x − sin 3x'), ', концы при нуле. Впишите показатели экспонент.'],
    build: supBlanks([{ parts: ['u(x, t) = e', E('−'), { box: '1', sup: true }, E('t'), ' sin x − e', E('−'), { box: '9', sup: true }, E('t'), ' sin 3x'],
      test: v => Math.abs(v[0]) === 1 && Math.abs(v[1]) === 9,
      why: ['Мода ', $m('sin kx'), ' затухает как ', $m('e', E('−k²t')), ': ', $m('k = 1'), ' и ', $m('k = 3'), '.'], hint: ['При ', $m('l = π'), ' и ', $m('a² = 1'), ': ', $m('λ', Sub('k'), ' = k²'), '.'] }]),
  }, {
    id: 'p-cube', prompt: ['Задача 2. Те же условия, но ', $m('u(x, 0) = sin', E('3'), 'x'), '. Подсказка: ', $m('sin 3x = 3 sin x − 4 sin', E('3'), 'x'), '.'],
    build: blanks([
      { parts: ['sin', E('3'), 'x = ', { box: '3/4' }, ' sin x − ', { box: '1/4' }, ' sin 3x'], why: ['Из подсказки: ', $m('sin', E('3'), 'x = ', F('3 sin x − sin 3x', '4')), '.'], hint: ['Выразите ', $m('sin', E('3'), 'x'), ' из подсказки.'] },
      { parts: ['u(', F('π', '2'), ', t) = ', { box: '3/4' }, ' e', E('−t'), ' + ', { box: '1/4' }, ' e', E('−9t')],
        why: [$m('u = ', F('3', '4'), 'e', E('−t'), ' sin x − ', F('1', '4'), 'e', E('−9t'), ' sin 3x'), ', а ', $m('sin ', F('3π', '2'), ' = −1'), ', поэтому минус стал плюсом.'],
        hint: ['Подставьте ', $m('x = π/2'), ': ', $m('sin ', F('π', '2'), ' = 1'), ', ', $m('sin ', F('3π', '2'), ' = −1'), '.'] },
    ]),
  }], done, 'Практика 1 из 3 · вопрос') }],

  ['final2', 'Практика 2', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-resonance', prompt: ['Задача 5. ', $m('u', Sub('t'), ' − u', Sub('xx'), ' = e', E('−t'), ' sin x'), ' на ', $m('(0, π)'), ', ', $m('u(x, 0) = 0'), ', концы при нуле. Найдите ', $m('u(x, t)'), '.'],
    build: choice([[$m('t e', E('−t'), ' sin x')], [$m('(1 − e', E('−t'), ') sin x')], [$m('e', E('−t'), ' sin x')], [$m('(e', E('−t'), ' − e', E('−2t'), ') sin x')]], 0,
      [$m('T′ + T = e', E('−t')), ', ', $m('T(0) = 0'), '. Умножим на ', $m('e', E('t')), ': ', $m('(e', E('t'), 'T)′ = 1'), ', откуда ', $m('T = t e', E('−t')), '.'],
      [null, ['Это ответ для постоянного источника ', $m('sin x'), '; здесь источник сам гаснет как ', $m('e', E('−t')), '.'],
        ['Это решение без источника с ', $m('T(0) = 1'), ', а здесь ', $m('u(x, 0) = 0'), '.'],
        ['Подставьте: ', $m('T′ + T = e', E('−2t')), ', а нужно ', $m('e', E('−t')), '.']]),
  }, {
    id: 'p-shift', prompt: ['Задача 9. ', $m('u', Sub('t'), ' − u', Sub('xx'), ' = t e', E('−t'), ' sin x'), ', ', $m('u(x, 0) = 2 sin x − 2x'), ', ', $m('u(0, t) = 0'), ', ', $m('u(π, t) = −2π'), '.'],
    build: blanks([
      { parts: ['w(x) = ', { box: '-2' }, 'x'], why: ['Прямая через ', $m('(0, 0)'), ' и ', $m('(π, −2π)'), '.'], hint: ['Значения на концах: ', $m('0'), ' и ', $m('−2π'), '.'] },
      { parts: ['u(x, t) = (', F('t²', '2'), ' + ', { box: '2' }, ') e', E('−t'), ' sin x − 2x'],
        why: [$m('Φ = 2 sin x'), '; ', $m('T′ + T = t e', E('−t')), ', ', $m('T(0) = 2'), ' дают ', $m('T = (', F('t²', '2'), ' + 2) e', E('−t')), '.'],
        hint: ['Постоянная равна ', $m('T(0)'), ' — коэффициенту при ', $m('sin x'), ' в ', $m('Φ = φ − w'), '.'] },
    ]),
  }], done, 'Практика 2 из 3 · вопрос') }],

  ['final3', 'Практика 3', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-rate', prompt: ['Задача 10. ', $m('u', Sub('t'), ' − 4u', Sub('xx'), ' = t e', E('−16t'), ' sin 2x'), ', ', $m('u(x, 0) = 3x − 2 sin 2x'), ', ', $m('u(0, t) = 0'), ', ', $m('u(π, t) = 3π'), '. После замены ', $m('u = v + 3x'), ' для моды ', $m('sin 2x'), ':'],
    build: blanks([{ parts: ['T′ + ', { box: '16' }, ' T = t e', E('−16t'), ',      T(0) = ', { box: '-2' }],
      why: [$m('a²λ', Sub('2'), ' = 4 · 2² = 16'), ', а ', $m('T(0)'), ' — коэффициент при ', $m('sin 2x'), ' в ', $m('Φ = −2 sin 2x'), '.'],
      hint: [$m('λ', Sub('2'), ' = (2π/π)² = 4'), ' и ', $m('a² = 4'), '.'] }]),
  }, {
    id: 'p-answer', prompt: ['Каков ответ задачи 10?'],
    build: choice([[$m('(', F('t²', '2'), ' − 2) e', E('−16t'), ' sin 2x + 3x')], [$m('(', F('t²', '2'), ' − 2) e', E('−4t'), ' sin 2x + 3x')], [$m('−2e', E('−16t'), ' sin 2x + 3x')], [$m('(t − 2) e', E('−16t'), ' sin 2x + 3x')]], 0,
      ['Умножим на ', $m('e', E('16t')), ': ', $m('(e', E('16t'), 'T)′ = t'), ', значит ', $m('e', E('16t'), 'T = ', F('t²', '2'), ' − 2'), '.'],
      [null, ['Показатель — ', $m('a²λ', Sub('2'), ' = 16'), ': вы забыли множитель ', $m('a² = 4'), '.'],
        ['Здесь нет вклада источника ', $m('t e', E('−16t'), ' sin 2x'), '.'],
        ['Интеграл от ', $m('t'), ' равен ', $m(F('t²', '2')), ', а не ', $m('t'), '.']]),
  }], done, 'Практика 3 из 3 · вопрос') }],

  ['finish', 'Конец главы', () => { panel(0); }, { ask: finishCard }],
].map(([id, title, run, extra]) => ({ id, title, run, ...extra }));

boot();
</script>
