'use strict';
const CHAPTER = { number: 2, label: '§ 1.2', title: 'Постановка задачи оптимального управления', minutes: 11, language: 'ru', next: '../ch03/' };

/* ---------- chapter data ---------- */
const A_PLUS = (s, t) => .45 + .35 * s, A_MINUS = (s, t) => -(.75 - .35 * t);
const U_DEMO = [[0, 1], [.35, -1], [.7, 1]];        // a bang-bang control for the boundary picture
const U_TENT = [[0, 1], [.5, -1]], U_PAUSE = [[0, 1], [.5, 0]];
const RIGHTCARD = { x: 980, y: 130, w: 590, cls: 'side', maxH: 640 };
// x(s, t) of the toy example for a control given as pieces.
const toyField = pieces => (s, t) => TOY.x(pieces, s, t);
// Mini sparkline of a control u(t) on [0, 1] (t to the right), w × h px centred on (x, y).
function spark(p, pieces, x, y, w, h, color = C_U) {
  const g = G(p, { o: 0 });
  path(g, `M${x - w / 2} ${y}H${x + w / 2}`, { stroke: COL.faint, 'stroke-width': 2 });
  let d = '';
  for (let i = 0; i <= 200; i++) { const t = i / 200; d += (i ? 'L' : 'M') + (x - w / 2 + w * t).toFixed(1) + ' ' + (y - h / 2 * TOY.uOf(pieces, t)).toFixed(1); }
  path(g, d, { stroke: color, 'stroke-width': 3 });
  return g;
}

/* ---------- beats ---------- */
const BEATS = [

    for (const e of [g, r, Dm.g, wig, ...fam]) tw(e, { o: 0 }, D - .9, .8);
  }],

  ['fixed', 'Фиксированные условия', (m) => {

    mline(p, [F('∂x', '∂t'), ' + A(s, t) ', F('∂x', '∂s'), ' = f(x, s, t)'], 60, 180, .3, COL.chalk, 44);

  }],

  ['controls', 'Допустимые управления', (m) => {

  ['q1', 'Проверка: допустимость', () => {
    const p = panel(0);
    const gr = ocGraph(p, { x0: 90, y0: 450, w: 780, k: 160, lo: -1.6, hi: 1.6, zl: 't', vl: ['u'], ends: ['0', '1'], t0: .2, tickAt: [[1, '1'], [-1, '−1']] });

  }, { ask: done => quiz(RIGHTCARD, [{

    ocBrace(p, pw[1][0], pw[1][0] + pw[1][1], 250, C_COST, m('term'));
    ocRow(p, ['конечное состояние:'], pw[1][0], 310, m('term', .3), { size: 24, fill: C_COST });
    ocRow(p, ['верхняя сторона'], pw[1][0], 342, m('term', .3), { size: 24, fill: C_COST });
    draw(D.top, m('term'), .8);
    ocBrace(p, pw[3][0], pw[3][0] + pw[3][1], 250, C_COST, m('run'));
    ocRow(p, ['всё время процесса:'], pw[3][0], 310, m('run', .3), { size: 24, fill: C_COST });
    ocRow(p, ['весь прямоугольник'], pw[3][0], 342, m('run', .3), { size: 24, fill: C_COST });

    put(tint, { o: 0 }); show(tint, m('run', .2), .8);
    ocRow(p, [cm(C_U, 'u'), '  →  ', $m('x'), '  →  ', cm(C_COST, 'J(u)')], 60, 470, m('dep'), { size: 34, msize: 44 });
    text(p, 'управление влияет на J только через состояние', 60, 530, m('dep', .5), { size: 26, fill: COL.dim });

  ['pipeline', 'Как вычислить J(u)', (m) => {
    const p = panel(0);
    const box = (x, w, title, items, color, t0) => {
      const g = G(p, { o: 0, y: 10 });
      mk('rect', { x, y: 150, width: w, height: 190, rx: 16, fill: COL.board, stroke: color, 'stroke-width': 3 }, g);
      T(g, title, { x: x + 24, y: 200, size: 28, weight: 600, fill: color });
      const r = ocRow(g, items, x + 24, 270, undefined, { size: 24, msize: 32 });
      put(r, { o: 1 });
      tw(g, { o: 1, y: 0 }, t0, .5);
      return g;
    };
    box(50, 440, 'Шаг 1. Задача Коши (2.3)', [cm(C_U, 'u(t)'), '  ↦  ', cm(C_PLUS, 'x', E('+'), '(s', Sub('0'), ', t)')], C_PLUS, m('s1'));
    box(560, 480, 'Шаг 2. Задача для (1.1)', ['данные снизу, слева, справа'], COL.chalk, m('s2'));
    box(1110, 440, 'Шаг 3. Интегралы (2.5)', [$m('x(s, t)'), '  ↦  ', cm(C_COST, 'J(u)')], C_COST, m('s3'));
    show(ocArrow(p, 495, 245, 552, 245, COL.task), m('s2', -.3));

  ['toy', 'Пример', (m) => {
    const p = panel(0);
    const D = S.D = ocDomain(p, { x0: 960, y0: 790, w: 460, h: 460, t0: .2, name: '', sl: ['0', '', '1', ''], tl: ['0', '', '1', ''] });
    text(p, 'Сквозной пример курса', 60, 120, .3, { size: 28, fill: COL.task, weight: 600 });
    mline(p, [F('∂x', '∂t'), ' + ', F('∂x', '∂s'), ' = 0,    0 < s, t < 1,    x(s, 0) = 0'], 60, 200, m('eq'), COL.chalk, 36);
    draw(D.bottom, m('eq', .5), .6);
    ocFamily(G(p, { o: .5 }), D, () => 1, [[0, 0], [.25, 0], [.5, 0], [.75, 0], [0, .25], [0, .5], [0, .75]], C_PLUS, m('eq', 1), { heads: false, width: 2 });
    mline(p, ['x(0, t) = y(t):   ', 'y′ = u,   y(0) = 0,   |u| ≤ 1'], 60, 280, m('bnd'), C_PLUS, 36);
    draw(D.left, m('bnd', .5), .6);

    mline(p, ['t = 0,3'], D.x0 - 18, D.Y(.3) + 10, m('photo', 3), COL.task, 28, 'end');
    mline(p, ['s = 0,7'], D.X(.7), D.Y(1) - 22, m('photo', 4.5), COL.task, 28, 'middle');
    ocRow(p, ['значение, поданное в момент ', $m('t'), ', приходит наверх в ', $m('s = 1 − t')], 60, 480, m('photo', 2), { size: 28, msize: 32 });
    text(p, 'верх — перевёрнутая фотография истории границы:', 60, 560, m('photo', 8), { size: 28, fill: COL.dim });

  ['play', 'Два управления', (m) => {
    const p = panel(0);
    const D = ocDomain(p, { x0: 860, y0: 800, w: 420, h: 420, t0: .2, name: '', sl: ['0', '', '1', ''], tl: ['0', '', '1', ''] });
    draw(D.top, .3, .5);
    const ug = ocVGraph(p, D, { xz: 520, k: 60, lo: -1, hi: 1, t0: .3, vl: ['u'], color: C_U });
    const yg = ocVGraph(p, D, { xz: 700, k: 110, lo: -1 / 3, hi: 1, t0: .3, vl: ['y'], color: C_PLUS });
    const tg = ocGraph(p, { x0: D.x0, y0: 260, w: D.w, k: 100, lo: -1, hi: 1.2, vl: ['x(s, 1)'], ends: ['0', '1'], t0: .3 });
    const wt = path(tg.g, tg.d(TOY.w), { stroke: C_COST, 'stroke-width': 3, 'stroke-dasharray': '8 8' }, { o: 0 });
    show(wt, .5);
    mline(p, ['вес 3s − 1'], tg.X(1) + 12, tg.Y(2) + 40, .6, C_COST, 24);
    const runCase = (pieces, color, t0, dur) => {
      const uc = ocCurve(ug, t => TOY.uOf(pieces, t), C_U, 4), yc = path(yg.g, '', { stroke: C_PLUS, 'stroke-width': 4 });
      const fld = ocField(p, D, () => null, { scale: .6, n: 40, m: 40 });
      p.insertBefore(fld, D.top);
      const prof = path(tg.g, '', { stroke: color, 'stroke-width': 5 });
      draw(uc, t0, .8); show(fld, t0);
      ocRun(τ => {
        yc.setAttribute('d', yg.d(t => TOY.y(pieces, t), 0, Math.max(τ, .001)));
        fld.set((s, t) => t <= τ ? TOY.x(pieces, s, t) : null, .6);
      }, t0 + .5, dur, 0, 1, lin);
      return { uc, yc, fld, prof };
    };
    const A = runCase(U_ONE, COL.chalk, m('one', .3), 4);
    prog(q => A.prof.setAttribute('d', tg.d(s => TOY.x(U_ONE, s, 1), 1 - q, 1)), m('top'), 1.5, io);
    const J0 = ocRow(p, [$m('u ≡ 1:   x(s, 1) = 1 − s')], 60, 300, m('one'), { size: 26, msize: 30 });
    const J0b = ocRow(p, [$m('J = ∫', Lim('0', '1'), ' (3s − 1)(1 − s) ds = 0')], 60, 370, m('j0'), { size: 26, msize: 28 });
    for (const e of [A.uc, A.yc, A.fld, A.prof]) tw(e, { o: .18 }, m('star', -.4), .5);
    const B = runCase(U_STAR, COL.task, m('star', .3), 4);
    prog(q => B.prof.setAttribute('d', tg.d(s => TOY.x(U_STAR, s, 1), 1 - q, 1)), m('v'), 1.5, io);

  ['q2', 'Проверка: фотография', () => {

      { parts: ['x(0,2; 1) = ', { box: '0.2' }], why: 'x(0,2; 1) = y(0,8) = 1 − 0,8 = 0,2.', hint: 'x(s, 1) = y(1 − s).' },
      { parts: ['x(0,7; 1) = ', { box: '0.3' }], why: 'x(0,7; 1) = y(0,3) = 0,3.', hint: 'x(s, 1) = y(1 − s).' },

      { parts: ['Условия при ', $m('t = t', Sub('0')), ' и ', $m('s = s', Sub('1')), ' в этой постановке фиксированы'], ans: ['t'], why: 'Да: (2.1) и (2.2).' },

      { parts: ['Чтобы найти ', $m('J(u)'), ', достаточно решить задачу Коши (2.3)'], ans: ['f'], why: 'Нет: затем нужно решить гиперболическую систему и посчитать интегралы.' },
    ], [['t', 'верно', COL.good, '1'], ['f', 'неверно', COL.bad, '2']], { multi: false, text: true }),
  }], done, 'Практика по параграфу   2 из 3') }],

  ['final3', 'Практика 3', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-pause', prompt: ['Управление с паузой: ', $m('u = 1'), ' при ', $m('t < 1/2'), ', ', $m('u = 0'), ' при ', $m('t ≥ 1/2'), '. Найдите ', $m('y(1/2)'), ', значение на верхней стороне и функционал.'],
    build: blanks([

      { parts: ['x(0,2; 1) = ', { box: '0.5' }], why: 'x(0,2; 1) = y(0,8) = 1/2: после паузы y не меняется.', hint: 'x(s, 1) = y(1 − s), а после t = 1/2 y стоит на месте.' },

    ]),
  }], done, 'Практика по параграфу   3 из 3') }],

  ['finish', 'Готово', () => { panel(0); }, { ask: finishCard }],
].map(([id, title, run, extra]) => ({ id, title, run, ...extra }));
